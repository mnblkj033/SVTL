name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: 启动器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 构建
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 同时发到 Release，方便用 gh-proxy 直接下载
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view launcher-latest >/dev/null 2>&1 ||             gh release create launcher-latest --title "SVTL Launcher (latest)" --notes "每次构建自动更新"
          gh release upload launcher-latest app/build/outputs/apk/debug/app-debug.apk --clobber
