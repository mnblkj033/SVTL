name: merge

# 手动触发：把启动器合并进游戏 APK，产出单体安装包
on:
  workflow_dispatch:
    inputs:
      game_apk_url:
        description: "可选：覆盖游戏 APK 直链（留空则从私有仓库 mnblkj033/APK 下载）"
        required: false
      core_so_url:
        description: "可选：libsvtl.so 直链（留空则运行时从压缩包加载）"
        required: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 构建启动器
        run: gradle :app:assembleDebug --no-daemon

      - name: 下载游戏 APK
        env:
          GH_TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
        run: |
          if [ -n "${{ inputs.game_apk_url }}" ]; then
            curl -fL "${{ inputs.game_apk_url }}" -o game.apk
          else
            gh release download game-1.6.15.3 -R mnblkj033/APK -p "*.apk" -D .
            mv *.apk game.apk
          fi
          ls -lh game.apk

      - name: 构建核心库（Rust → arm64）
        run: |
          if [ -n "${{ inputs.core_so_url }}" ]; then
            echo "使用外部核心库"
            curl -fL "${{ inputs.core_so_url }}" -o libsvtl.so
          else
            rustup target add aarch64-linux-android
            NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
            echo "NDK=$NDK"
            CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
            test -x "$CLANG" || CLANG=$(ls "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android*-clang | sort | tail -1)
            echo "CLANG=$CLANG"
            CC_aarch64_linux_android="$CLANG" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG" \
              cargo build --release --target aarch64-linux-android -p svtl-core
            cp target/aarch64-linux-android/release/libsvtl.so libsvtl.so
          fi
          ls -lh libsvtl.so

      - name: 合并 + 签名
        run: |
          chmod +x tools/merge_ci.sh
          tools/merge_ci.sh game.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            app/svtl.jks \
            SVTL-merged.apk \
            libsvtl.so

      - uses: actions/upload-artifact@v4
        with:
          name: SVTL-merged
          path: SVTL-merged.apk

      # 同时发到私有仓库的 Release，方便自己下载（不公开）
      - name: 发布到私有 Release
        env:
          GH_TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
        run: |
          gh release view merged-latest -R mnblkj033/APK >/dev/null 2>&1 ||             gh release create merged-latest -R mnblkj033/APK --title "SVTL merged" --notes "游戏 + 启动器"
          gh release upload merged-latest SVTL-merged.apk -R mnblkj033/APK --clobber
          echo "下载地址：https://github.com/mnblkj033/APK/releases/tag/merged-latest"
