name: merge

# 手动触发：把启动器合并进游戏 APK，产出单体安装包
on:
  workflow_dispatch:
    inputs:
      game_apk_url:
        description: "游戏 APK 的直链（Release 附件 / 网盘直链）"
        required: true
      core_so_url:
        description: "libsvtl.so 直链（可选，留空则从压缩包加载）"
        required: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 构建启动器
        run: gradle :app:assembleDebug --no-daemon

      - name: 下载游戏 APK
        run: |
          curl -fL "${{ inputs.game_apk_url }}" -o game.apk
          ls -lh game.apk

      - name: 下载核心库（可选）
        if: ${{ inputs.core_so_url != '' }}
        run: curl -fL "${{ inputs.core_so_url }}" -o libsvtl.so

      - name: 合并 + 签名
        run: |
          python3 tools/merge_apk.py \
            --game game.apk \
            --launcher app/build/outputs/apk/debug/app-debug.apk \
            --lib "$( [ -f libsvtl.so ] && echo libsvtl.so || echo '' )" \
            --keystore app/svtl.jks \
            --out SVTL-merged.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SVTL-merged
          path: SVTL-merged.apk
